<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SALEPRO by MONTE — ตัวอย่างหน้าจอ (ข้อมูลสมมติ)</title>
<style>
  :root{--bg:#eef3f9;--card:#fff;--line:#d5deea;--text:#1b2a3a;--muted:#5b6b7e;--primary:#1a74bf;--accent:#1a74bf;--danger:#d64545;--ok:#0f9d6b;--warn:#b7791f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Noto Sans Thai",sans-serif}
  .banner{background:#fff4d6;color:#7a4b00;padding:7px 14px;font-size:13px;text-align:center;border-bottom:1px solid #f1d78b}
  .app{display:flex;min-height:calc(100vh - 34px)}
  aside{width:236px;flex:none;background:#fff;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;z-index:30}
  .brand{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
  .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#2f9fe6,#1a74bf);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:20px}
  .brand b{display:block;line-height:1.15} .brand small{color:var(--muted)}
  #tabs{padding:8px 0;flex:1}
  .nv{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-left:4px solid transparent;color:#2d3f52;padding:10px 16px;cursor:pointer;font:inherit}
  .nv:hover{background:#f3f7fb} .nv.on{background:#e3f0fb;border-left-color:var(--primary);color:#0f4c81;font-weight:600}
  .nv i{font-style:normal;width:22px;text-align:center}
  .side-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
  .side-foot select{width:100%;margin-top:4px}
  .mainwrap{flex:1;min-width:0}
  .topbar{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;padding:10px 18px;background:linear-gradient(#fff,#f3f7fb);border-bottom:1px solid var(--line)}
  .topbar h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar input{width:220px;max-width:36vw}
  #burger{display:none}
  main{max-width:1040px;margin:0 auto;padding:18px}
  select,input,button,textarea{font:inherit}
  select,input,textarea{background:#fff;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-height:40px}
  h2{font-size:19px;margin:4px 0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,50,90,.05)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .grid .card{margin:0}
  .kpi b{display:block;font-size:26px;margin-top:2px}
  .kpi.bad{border-color:#f0a5a5;background:#fff6f6} .kpi.bad b{color:#c0392b}
  .muted{color:var(--muted)} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pill{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;background:#e8eef5;color:#334155}
  .ok{background:#d6f5e8;color:#065f46}.warn{background:#fdecc8;color:#8a5a00}.bad{background:#fde0e0;color:#991b1b}
  .btn{background:var(--primary);border:0;color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;min-height:40px}
  .btn:hover{background:#155f9c} .btn.ghost{background:#fff;color:#1a4f80;border:1px solid var(--line)} .btn.ghost:hover{background:#f3f7fb}
  .btn.red{background:var(--danger);color:#fff} .btn[disabled]{opacity:.45;cursor:not-allowed}
  a{color:var(--primary)} table{width:100%;border-collapse:collapse}
  th{background:linear-gradient(#f7f9fc,#e9eff6);cursor:pointer;user-select:none} th:hover{background:#e1e9f2}
  td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  .r{text-align:right}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1b2a3a;color:#fff;padding:10px 16px;border-radius:10px;display:none;max-width:90vw;z-index:99}
  .zone{color:#0f4c81;font-weight:700;margin:14px 0 6px}
  .ro{border:1px dashed #d9a441;background:#fffaf0;color:#7a4b00;border-radius:10px;padding:6px 10px;font-size:13px;margin-bottom:10px}
  .calbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .calbar h2{margin:0;flex:1;min-width:150px}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .cal .h{background:#f1f5fa;padding:6px;text-align:center;font-size:12px;color:var(--muted)}
  .day{background:#fff;min-height:96px;padding:4px 5px;cursor:pointer;overflow:hidden}
  .day:hover{background:#f6faff} .day.o{background:#f7f9fc;color:#9aa8b8}
  .day .n{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:12px;font-size:13px}
  .day.t .n{background:var(--primary);color:#fff} .day.sel{outline:2px solid var(--primary);outline-offset:-2px;background:#f0f7ff}
  .c{font-size:11px;border-radius:4px;padding:1px 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#dbeafe;color:#1e40af;border-left:3px solid #1a74bf}
  .c.done{background:#d6f5e8;color:#065f46;border-left-color:#0f9d6b} .c.other{background:#eef0f4;color:#445;border-left-color:#8a96a8}
  .more{font-size:11px;color:var(--muted);margin-top:2px}
  @media(max-width:800px){
    aside{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 14px rgba(0,0,0,.2)}
    aside.open{transform:none} #burger{display:inline-block}
    .topbar input{width:96px} .topbar h1{font-size:15px;min-width:70px} main{padding:12px}
    .day{min-height:58px} .day .c:nth-of-type(n+2){display:none} .c{font-size:10px}
  }
</style>
</head>
<body>
<div class="banner">นี่คือ <b>ตัวอย่างหน้าจอด้วยข้อมูลสมมติ</b> เพื่อให้ตรวจ flow และหน้าตา — ไม่ได้เชื่อมฐานข้อมูลจริง รีเฟรชแล้วข้อมูลจะกลับเป็นค่าเริ่มต้น</div>
<div class="app">
  <aside id="side">
    <div class="brand"><div class="logo">S</div><div><b>SALEPRO</b><small>by MONTE</small></div></div>
    <div style="padding:10px 16px;border-bottom:1px solid var(--line)"><small class="muted">บริษัท</small><br><b>ตัวอย่างวิศวกรรม จำกัด</b></div>
    <nav id="tabs"></nav>
    <div class="side-foot"><label>ดูในบทบาท
      <select id="role">
        <option value="owner">เจ้าของ</option><option value="admin">แอดมิน</option><option value="sales" selected>เซลส์</option>
        <option value="warehouse">คลังสินค้า</option><option value="dispatcher">ผู้จัดส่ง</option><option value="viewer">ผู้ดูอย่างเดียว</option>
      </select></label></div>
  </aside>
  <div class="mainwrap">
    <div class="topbar"><button class="btn ghost" id="burger" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <h1 id="ptitle"></h1><input id="q" placeholder="ค้นหา..." oninput="applySearch()"><span id="topact"></span></div>
    <main id="view"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const ROLE_EDIT = {
  customers:['owner','admin','sales'], visits:['owner','admin','sales'], jobs:['owner','admin','sales'], quotes:['owner','admin','sales'],
  products:['owner','admin','warehouse'], stock:['owner','admin','warehouse'], delivery:['owner','admin','dispatcher','warehouse'], zones:['owner','admin','dispatcher'], members:['owner','admin']
};
const TABS = [['dash','แดชบอร์ด','🏠'],['customers','ลูกค้า','👥'],['visits','แผนเข้าพบ','📅'],['jobs','Job Ticket','🎫'],['quotes','ใบเสนอราคา','🧾'],['products','สินค้า','📦'],['stock','สต็อก','📊'],['delivery','ส่งของ (DO)','🚚'],['zones','โซนส่งของ','🗺️'],['members','สมาชิก','🔑']];
const BASE=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const mins=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const THM=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const WD=['อา','จ','อ','พ','พฤ','ศ','ส'];
const baht = n => n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mapLink = (la,ln)=>`https://www.google.com/maps/search/?api=1&query=${la},${ln}`;
const dirLink = (la,ln)=>`https://www.google.com/maps/dir/?api=1&destination=${la},${ln}`;
const km = (a,b)=>{const R=6371,r=d=>d*Math.PI/180,dl=r(b[0]-a[0]),dg=r(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))};

const S = {
  tab:'dash',
  zones:[{id:'N1',name:'กรุงเทพฯ เหนือ',prov:'กรุงเทพฯ, ปทุมธานี'},{id:'E1',name:'ตะวันออก',prov:'ชลบุรี, ระยอง'},{id:'S1',name:'กรุงเทพฯ ใต้ / สมุทรปราการ',prov:'สมุทรปราการ'}],
  customers:[
    {id:1,code:'C001',name:'บริษัท สยามพัมพ์ จำกัด',phone:'02-111-2222',addr:[{label:'โรงงานบางนา',line:'99 ถ.บางนา-ตราด',prov:'สมุทรปราการ',lat:13.6604,lng:100.6052,zone:'S1',def:true,contact:'คุณสมชาย 081-111-1111'}]},
    {id:2,code:'C002',name:'บริษัท อีสเทิร์นแมชชีน จำกัด',phone:'038-333-444',addr:[{label:'โรงงานอมตะ',line:'700 นิคมอมตะซิตี้',prov:'ชลบุรี',lat:13.4968,lng:101.0042,zone:'E1',def:true,contact:'คุณนภา 089-222-3333'}]},
    {id:3,code:'C003',name:'ห้างหุ้นส่วน นอร์ทเทิร์นเทค',phone:'02-555-6666',addr:[{label:'สำนักงานใหญ่',line:'12 ถ.พหลโยธิน',prov:'ปทุมธานี',lat:13.9892,lng:100.6171,zone:'N1',def:true,contact:'คุณวิชัย 086-444-5555'},{label:'คลังสินค้า',line:'55 ถ.รังสิต-นครนายก',prov:'ปทุมธานี',lat:14.0208,lng:100.7342,zone:'N1',def:false,contact:'คุณพร 082-777-8888'}]}
  ],
  products:[
    {id:1,sku:'PMP-100',name:'ปั๊มน้ำอุตสาหกรรม 100L',unit:'ตัว',price:12500,min:5,on:12,res:0},
    {id:2,sku:'VLV-050',name:'วาล์วควบคุม 2 นิ้ว',unit:'ตัว',price:3200,min:10,on:14,res:0},
    {id:3,sku:'SNS-PRS',name:'เซนเซอร์แรงดัน',unit:'ชิ้น',price:2100,min:8,on:6,res:0}
  ],
  moves:[],
  visits:[
    {id:1,cust:1,title:'ติดตามผลทดลองปั๊ม',off:0,s:'09:00',e:'10:30',who:'me',status:'planned',checked:false},
    {id:2,cust:2,title:'สำรวจหน้างานวาล์วใหม่',off:0,s:'13:30',e:'15:00',who:'me',status:'planned',checked:false},
    {id:3,cust:3,title:'นำเสนอใบเสนอราคา',off:1,s:'10:00',e:'11:00',who:'other',status:'planned',checked:false},
    {id:4,cust:1,title:'ส่งมอบและอบรมการใช้งาน',off:3,s:'14:00',e:'16:00',who:'me',status:'planned',checked:false},
    {id:5,cust:2,title:'ประชุมสรุปโครงการ',off:-2,s:'09:30',e:'11:00',who:'me',status:'done',checked:true},
    {id:6,cust:3,title:'สำรวจพื้นที่ติดตั้ง',off:8,s:'10:00',e:'12:00',who:'other',status:'planned',checked:false}
  ],
  cal:{y:BASE.getFullYear(),m:BASE.getMonth(),sel:dkey(BASE)},vmine:'all',vSeq:6,
  jobs:[
    {id:1,no:'JT-2026-0001',cust:3,title:'เซนเซอร์ค่าเพี้ยน ขอเปลี่ยนชุดใหม่',pri:'สูง',status:'in_progress',due:'2026-11-20',log:['เปิดงาน','เปิดงาน → กำลังดำเนินการ']},
    {id:2,no:'JT-2026-0002',cust:1,title:'ขอใบเสนอราคาปั๊ม 3 ตัว',pri:'ปกติ',status:'open',due:'2026-12-05',log:['เปิดงาน']}
  ],
  quotes:[
    {id:1,no:'QT-2026-0001',cust:1,status:'draft',discount:0,vat:7,items:[{d:'ปั๊มน้ำอุตสาหกรรม 100L',q:3,u:12500}]}
  ],
  dos:[],
  doSeq:0, qSeq:1, jSeq:2,
  open:{}
};
const role = () => document.getElementById('role').value;
const can = m => ROLE_EDIT[m].includes(role());
const roNote = m => can(m) ? '' : `<div class="ro">บทบาทนี้ดูได้อย่างเดียว — ปุ่มแก้ไขถูกซ่อน (ฐานข้อมูลบังคับสิทธิ์เดียวกัน)</div>`;
const custName = id => (S.customers.find(c=>c.id===id)||{}).name||'-';
const avail = p => p.on - p.res;
const isLow = p => p.min>0 && avail(p) <= p.min;
const qTotals = q => {const sub=q.items.reduce((s,i)=>s+Math.round(i.q*i.u*100)/100,0);const base=Math.max(sub-q.discount,0);const vat=Math.round(base*q.vat)/100;return {sub,vat,total:base+vat}};
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function log(p,kind,delta,resDelta,note){S.moves.unshift({p:p.id,kind,delta,resDelta,after:p.on,note,t:new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})})}

const V = {
dash(){
  const low=S.products.filter(isLow);const open=S.jobs.filter(j=>!['done','cancelled'].includes(j.status));
  const over=open.filter(j=>j.due<dkey(BASE));const sent=S.quotes.filter(q=>q.status==='sent').reduce((s,q)=>s+qTotals(q).total,0);
  const won=S.quotes.filter(q=>q.status==='accepted').reduce((s,q)=>s+qTotals(q).total,0);
  const k=(l,v,bad)=>`<div class="card kpi ${bad?'bad':''}"><span class="muted">${l}</span><b>${v}</b></div>`;
  return `<div class="grid">
   ${k('นัดเข้าพบวันนี้',S.visits.filter(v=>v.off===0&&v.status==='planned').length)}${k('นัดเข้าพบ 7 วัน',S.visits.filter(v=>v.off>=0&&v.off<7&&v.status==='planned').length)}
   ${k('Job ที่ยังเปิด',open.length)}${k('Job เกินกำหนด',over.length,over.length>0)}
   ${k('ใบเสนอราคารอตอบ (บาท)',baht(sent))}${k('ปิดได้ 30 วัน (บาท)',baht(won))}
   ${k('DO รอจัดส่ง',S.dos.filter(d=>['draft','ready'].includes(d.status)).length)}${k('DO ระหว่างจัดส่ง',S.dos.filter(d=>d.status==='dispatched').length)}
   ${k('สินค้าต่ำกว่า Safety Stock',low.length,low.length>0)}</div>
   ${low.length?`<div class="card"><b>สินค้าที่ต้องสั่งเพิ่ม</b>${low.map(p=>`<div class="row" style="justify-content:space-between;margin-top:6px"><span class="muted">${p.sku} ${p.name}</span><span class="pill bad">ใช้ได้ ${avail(p)} / Safety ${p.min}</span></div>`).join('')}</div>`:''}
   <p class="muted">ลองทำ: ไปแท็บ "ส่งของ (DO)" สร้าง DO → พร้อมส่ง → ออกจัดส่ง แล้วกลับมาดูตัวเลขและสต็อกเปลี่ยน</p>`;
},
customers(){
  return `${roNote('customers')}${S.customers.map(c=>`<div class="card f"><b>${c.name}</b> <span class="muted">${c.code} · ${c.phone} · ${c.addr.length} ที่อยู่</span>
   ${c.addr.map(a=>`<div style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px"><b>${a.label}</b> ${a.def?'<span class="pill ok">ค่าเริ่มต้น</span>':''} <span class="pill">${(S.zones.find(z=>z.id===a.zone)||{}).name||'ไม่ระบุโซน'}</span>
   <div class="muted">${a.line} ${a.prov} · ติดต่อ ${a.contact}</div><div class="muted">พิกัด ${a.lat}, ${a.lng}</div>
   <div class="row"><a href="${mapLink(a.lat,a.lng)}" target="_blank" rel="noopener">เปิดแผนที่</a><a href="${dirLink(a.lat,a.lng)}" target="_blank" rel="noopener">นำทาง</a></div></div>`).join('')}
   ${can('customers')?`<div class="row" style="margin-top:8px"><button class="btn ghost" onclick="toast('ฟอร์มเพิ่มที่อยู่: ชื่อสถานที่ / ที่อยู่ / จังหวัด / ละติจูด-ลองจิจูด / ปุ่ม ใช้ตำแหน่งปัจจุบัน / โซน')">+ เพิ่มที่อยู่</button></div>`:''}</div>`).join('')}
   <p class="muted">หมายเหตุ: หน้าปักหมุดบนแผนที่ในแอปจะเพิ่มเมื่อมี Google Maps API key — ตอนนี้ใช้ช่องพิกัด, ปุ่มตำแหน่งปัจจุบัน และลิงก์เปิด Google Maps</p>`;
},
visits(){
  const c=S.cal,first=new Date(c.y,c.m,1),start=addD(first,-first.getDay());
  const rows=Math.ceil((first.getDay()+new Date(c.y,c.m+1,0).getDate())/7);
  const vs=S.visits.filter(v=>v.status!=='cancelled'&&(S.vmine==='all'||v.who==='me'));
  const byDay={};vs.forEach(v=>{(byDay[dkey(addD(BASE,v.off))]=byDay[dkey(addD(BASE,v.off))]||[]).push(v)});
  let cells=WD.map(w=>`<div class="h">${w}</div>`).join('');
  for(let i=0;i<rows*7;i++){const d=addD(start,i),k=dkey(d),list=(byDay[k]||[]).sort((a,b)=>a.s.localeCompare(b.s));
    cells+=`<div class="day ${d.getMonth()!==c.m?'o':''} ${k===dkey(BASE)?'t':''} ${k===c.sel?'sel':''}" onclick="selDay('${k}')"><span class="n">${d.getDate()}</span>
     ${list.slice(0,3).map(v=>`<div class="c ${v.status==='done'?'done':v.who==='me'?'':'other'}">${v.s} ${custName(v.cust).replace('บริษัท ','').replace('ห้างหุ้นส่วน ','')}</div>`).join('')}${list.length>3?`<div class="more">+${list.length-3} นัด</div>`:''}</div>`}
  const sel=(byDay[c.sel]||[]).sort((a,b)=>a.s.localeCompare(b.s));
  const sd=new Date(c.sel+'T00:00:00');
  return `${roNote('visits')}<div class="calbar"><h2>${THM[c.m]} ${c.y+543}</h2>
   <button class="btn ghost" onclick="calGo(-1)">‹</button><button class="btn ghost" onclick="calToday()">วันนี้</button><button class="btn ghost" onclick="calGo(1)">›</button>

  <p class="muted">ที่อยู่/พิกัดปลายทางถูกคัดลอกลง DO ตอนสร้าง — แก้ที่อยู่ลูกค้าภายหลังไม่กระทบ DO ที่ออกไปแล้ว · เมื่อ "พร้อมส่ง" ระบบจองสต็อก ถ้าไม่พอจะปฏิเสธ · เมื่อ "ออกจัดส่ง" จึงตัดสต็อกจริง</p>`;

const TOPACT={customers:['+ ลูกค้า',"toast('ฟอร์มเพิ่มลูกค้า: รหัส / ชื่อ / โทรศัพท์ / อีเมล แล้วเพิ่มที่อยู่และพิกัด')"],visits:['+ นัดหมาย',"goForm()"],jobs:['+ Job Ticket','addJob()'],quotes:['+ ใบเสนอราคา','addQuote()'],products:['+ สินค้า',"toast('ฟอร์มลงทะเบียนสินค้า: SKU / ชื่อ / หน่วย / ราคาขาย / ต้นทุน / Safety Stock')"],zones:['+ โซน',"toast('ฟอร์มเพิ่มโซน: รหัส / ชื่อ / จังหวัดในโซน')"]};
function render(){
  document.getElementById('tabs').innerHTML=TABS.map(([k,l,i])=>`<button class="nv ${S.tab===k?'on':''}" onclick="S.tab='${k}';document.getElementById('side').classList.remove('open');document.getElementById('q').value='';render()"><i>${i}</i>${l}</button>`).join('');
  document.getElementById('ptitle').textContent=(TABS.find(t=>t[0]===S.tab)||[])[1]||'';
  const ta=TOPACT[S.tab];document.getElementById('topact').innerHTML=ta&&can(S.tab)?`<button class="btn" onclick="${ta[1]}">${ta[0]}</button>`:'';
  document.getElementById('view').innerHTML=V[S.tab]();
  applySearch();
}
function applySearch(){const q=document.getElementById('q').value.trim().toLowerCase();document.querySelectorAll('#view .card.f').forEach(e=>{e.style.display=!q||e.textContent.toLowerCase().includes(q)?'':'none'});
  document.querySelectorAll('#view table tr').forEach((r,i)=>{if(r.querySelector('th'))return;r.style.display=!q||r.textContent.toLowerCase().includes(q)?'':'none'})}
function selDay(k){S.cal.sel=k;const d=new Date(k+'T00:00:00');S.cal.y=d.getFullYear();S.cal.m=d.getMonth();render()}
function calGo(n){const d=new Date(S.cal.y,S.cal.m+n,1);S.cal.y=d.getFullYear();S.cal.m=d.getMonth();render()}
function calToday(){S.cal={y:BASE.getFullYear(),m:BASE.getMonth(),sel:dkey(BASE)};render()}
function goForm(){const e=document.getElementById('vform');if(e)e.scrollIntoView({behavior:'smooth'});const t=document.getElementById('vt');if(t)t.focus()}
function addVisit(){const cust=+document.getElementById('vc').value,title=document.getElementById('vt').value.trim(),st=document.getElementById('vs').value,du=+document.getElementById('vd').value;
  if(!title)return toast('กรอกหัวข้อการเข้าพบ');if(!st)return toast('เลือกเวลาเริ่ม');
  const a=mins(st),b=a+du;if(b>1440)return toast('นัดต้องจบภายในวันเดียวกัน');
  const off=Math.round((new Date(S.cal.sel+'T00:00:00')-BASE)/864e5);
  const clash=S.visits.find(v=>v.who==='me'&&v.status==='planned'&&v.off===off&&mins(v.s)<b&&a<mins(v.e));
  if(clash)return toast('ช่วงเวลานี้คุณมีนัดอื่นอยู่แล้ว ('+clash.s+'–'+clash.e+') — ระบบปฏิเสธ');
  const hh=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
  S.vSeq++;S.visits.push({id:S.vSeq,cust,title,off,s:hh(a),e:hh(b),who:'me',status:'planned',checked:false});toast('เพิ่มนัดแล้ว');render()}
function vAct(id,a){const v=S.visits.find(x=>x.id===id);if(a==='checkin'){v.checked=true;toast('บันทึกตำแหน่งเช็คอิน (ตัวอย่าง)')}else v.status=a;render()}
document.getElementById('view').addEventListener('click',e=>{const th=e.target.closest('th');if(!th)return;const t=th.closest('table'),i=[...th.parentNode.children].indexOf(th),rows=[...t.querySelectorAll('tr')].filter(r=>!r.querySelector('th'));
  const dir=th.dataset.d==='a'?-1:1;th.dataset.d=dir===1?'a':'d';const num=x=>parseFloat(x.replace(/[^0-9.-]/g,''));
  rows.sort((x,y)=>{const a=x.children[i].textContent,b=y.children[i].textContent;return(isNaN(num(a))||isNaN(num(b))?a.localeCompare(b,'th'):num(a)-num(b))*dir}).forEach(r=>r.parentNode.appendChild(r))});
function addJob(){const c=S.customers[Math.floor(Math.random()*S.customers.length)];S.jSeq++;S.jobs.unshift({id:S.jSeq,no:'JT-2026-000'+S.jSeq,cust:c.id,title:'งานใหม่จากลูกค้า (ตัวอย่าง)',pri:'ปกติ',status:'open',due:'2026-12-15',log:['เปิดงาน']});toast('ออกเลข JT ให้อัตโนมัติ');render()}
function moveJob(id,s){const j=S.jobs.find(x=>x.id===id);j.log.push(j.status+' → '+s);j.status=s;render()}
function addQuote(){S.qSeq++;S.quotes.unshift({id:S.qSeq,no:'QT-2026-000'+S.qSeq,cust:3,status:'draft',discount:0,vat:7,items:[]});render()}
function addItem(id){const p=S.products[Math.floor(Math.random()*S.products.length)];S.quotes.find(q=>q.id===id).items.push({d:p.name,q:2,u:p.price});render()}
function disc(id){const v=parseFloat(prompt('ส่วนลด (บาท)','500'));if(!isNaN(v)&&v>=0){S.quotes.find(q=>q.id===id).discount=v;render()}}
function moveQuote(id,s){const q=S.quotes.find(x=>x.id===id);if(s==='sent'&&(q.items.length===0||q.discount>qTotals(q).sub)){toast('ต้องมีรายการ และส่วนลดต้องไม่เกินยอดรวม ก่อนส่ง');return}q.status=s;render()}
function setMin(id){const p=S.products.find(x=>x.id===id);const v=parseFloat(prompt('Safety Stock ใหม่',p.min));if(!isNaN(v)&&v>=0){p.min=v;render()}}
function recv(id){const p=S.products.find(x=>x.id===id);const v=parseFloat(prompt('จำนวนที่รับเข้า','10'));if(!(v>0))return;p.on+=v;log(p,'รับเข้า',v,0,'รับสินค้า');render()}
function adj(id){const p=S.products.find(x=>x.id===id);const v=parseFloat(prompt('ยอดนับจริงใหม่',p.on));if(isNaN(v)||v<p.res){toast('ยอดต้องไม่ต่ำกว่าที่จองไว้');return}const n=prompt('เหตุผล (จำเป็น)','นับสต็อกประจำเดือน');if(!n)return toast('การปรับยอดต้องใส่เหตุผล');log(p,'ปรับยอด',v-p.on,0,n);p.on=v;render()}
function makeDO(){const c=S.customers.find(x=>x.id==document.getElementById('doc').value);const p=S.products.find(x=>x.id==document.getElementById('dop').value);const q=parseFloat(document.getElementById('doq').value);if(!(q>0))return;
  const a=c.addr.find(x=>x.def)||c.addr[0];S.doSeq++;S.dos.push({id:S.doSeq,no:'DO-2026-'+String(S.doSeq).padStart(4,'0'),cust:c.id,zone:a.zone,ship:a.line+' '+a.prov,lat:a.lat,lng:a.lng,pid:p.id,item:p.name,qty:q,status:'draft',seq:0});toast('ออกเลข DO และคัดลอกที่อยู่/พิกัด/โซนลงเอกสาร');render()}
function doAct(id,to){const d=S.dos.find(x=>x.id===id);const p=S.products.find(x=>x.id===d.pid);
  if(to==='ready'){if(avail(p)<d.qty){toast('สต็อกไม่พอ (ใช้ได้ '+avail(p)+') — ระบบปฏิเสธ และสถานะยังเป็นร่าง');return}p.res+=d.qty;log(p,'จอง',0,d.qty,d.no)}
  if(to==='dispatched'){p.on-=d.qty;p.res-=d.qty;log(p,'ตัดจ่าย',-d.qty,-d.qty,d.no)}
  if(to==='cancelled'&&d.status==='ready'){p.res-=d.qty;log(p,'ปล่อยจอง',0,-d.qty,d.no)}
  d.status=to;render()}
function autoOrder(zid){const list=S.dos.filter(d=>d.zone===zid&&d.status!=='cancelled');let cur=null,left=[...list],n=0;while(left.length){let bi=0;if(cur){let bd=1e9;left.forEach((d,i)=>{const x=km(cur,[d.lat,d.lng]);if(x<bd){bd=x;bi=i}})}const [d]=left.splice(bi,1);d.seq=++n;cur=[d.lat,d.lng]}toast('จัดลำดับจุดส่งตามระยะใกล้ที่สุด');render()}
document.getElementById('role').addEventListener('change',render);
render();
</script>
