<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8"><link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SALEPRO by MONTE — ตัวอย่างหน้าจอ v3 (ข้อมูลสมมติ)</title>
<style>
  :root{--bg:#eef3fa;--card:#fff;--line:#d8e1ee;--text:#14233a;--muted:#5a6b82;--primary:#1d6df0;--cyan:#1fc8e8;--navy:#030b2e;--navy2:#0a2a7a;--danger:#d64545;--ok:#0f9d6b;--warn:#b7791f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Noto Sans Thai",sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .banner{background:#fff4d6;color:#7a4b00;padding:6px 12px;font-size:12px;text-align:center;border-bottom:1px solid #f1d78b}
  svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
  select,input,button,textarea{font:inherit}
  select,input,textarea{background:#fff;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-height:40px;max-width:100%}
  textarea{width:100%;min-height:70px}
  input[type=checkbox]{min-height:0;width:18px;height:18px;accent-color:var(--primary)}
  label.f{display:block;margin:0 0 10px;font-size:13px;color:var(--muted)} label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:3px;color:var(--text);font-size:15px}
  .top{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}
  .top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body.home .top{display:none}
  .ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;color:#1d4f8f;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .ib.hid{visibility:hidden}
  .av{width:38px;height:38px;border-radius:50%;border:0;background:linear-gradient(135deg,#1d6df0,#1fc8e8);color:#fff;font-weight:700;cursor:pointer;flex:none}
  #srow{padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)} #srow input{width:100%}
  main{max-width:980px;margin:0 auto;padding:14px}
  body.home main{padding-top:0}
  h2{font-size:18px;margin:4px 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px;box-shadow:0 1px 2px rgba(20,50,90,.05)}
  .muted{color:var(--muted)} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center} .between{justify-content:space-between}
  .pill{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;background:#e8eef5;color:#334155}
  .ok{background:#d6f5e8;color:#065f46}.warn{background:#fdecc8;color:#8a5a00}.bad{background:#fde0e0;color:#991b1b}
  .btn{background:var(--primary);border:0;color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:#1559c4} .btn.ghost{background:#fff;color:#1a4f80;border:1px solid var(--line)} .btn.ghost:hover{background:#f3f7fb}
  .btn.red{background:var(--danger)} .btn.sm{min-height:32px;padding:3px 10px;font-size:13px}
  a{color:var(--primary)} table{width:100%;border-collapse:collapse}
  th{background:linear-gradient(#f7f9fc,#e9eff6);cursor:pointer;user-select:none}
  td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top} .r{text-align:right}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#14233a;color:#fff;padding:10px 16px;border-radius:10px;display:none;max-width:90vw;z-index:300}
  .zone{color:#0f4c81;font-weight:700;margin:14px 0 6px}
  .ro{border:1px dashed #d9a441;background:#fffaf0;color:#7a4b00;border-radius:10px;padding:6px 10px;font-size:13px;margin-bottom:10px}
  /* bottom bar */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(20,50,90,.08)}
  .bar>div{display:flex;width:100%;max-width:640px;align-items:flex-end}
  .bi{flex:1;border:0;background:none;color:#6b7c93;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;cursor:pointer;min-height:58px}
  .bi.on{color:var(--primary);font-weight:700}
  .bi.mid{margin-top:-20px}
  .bi.mid .disc{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#1d6df0,#1fc8e8);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(29,109,240,.45);border:4px solid #fff}
  .bi.mid.on .disc{background:linear-gradient(135deg,#0a2a7a,#1d6df0)}
  /* sheet + modal + paper overlay */
  .ov{position:fixed;inset:0;background:rgba(3,11,46,.55);z-index:90;display:none}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;max-height:86vh;overflow:auto}
  .sheet h3{margin:0 0 10px;font-size:16px;text-align:center}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .tile{border:1px solid var(--line);background:#f6f9fe;border-radius:16px;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:#16345c}
  .tile svg.i{width:26px;height:26px;color:var(--primary)} .tile:hover{background:#e9f1fd}
  .mdl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:16px;padding:16px;width:min(560px,94vw);max-height:90vh;overflow:auto}
  /* desktop sidebar */
  #side{display:none}
  @media(min-width:1024px){
    #side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:240px;z-index:60;background:linear-gradient(180deg,#0a2a7a 0%,#030b2e 75%);color:#dce8ff;overflow:auto}
    body{padding-left:240px;padding-bottom:24px} .bar{display:none} .toast{bottom:24px;left:calc(50% + 120px)}
    #side .sb{display:flex;align-items:center;gap:10px;padding:16px 16px 12px} #side .sb img{width:44px;height:44px;border-radius:12px} #side .sb b{font:italic 800 20px/1 system-ui;color:#fff} #side .sb b span{color:var(--cyan)} #side .sb small{display:block;color:#a9c3ff;font-size:11px;margin-top:2px}
    #side .sg{padding:10px 18px 4px;font-size:11px;letter-spacing:.6px;color:#7f9be0}
    #side .sn{display:flex;gap:11px;align-items:center;width:100%;border:0;background:none;color:#dce8ff;padding:10px 18px;border-left:4px solid transparent;cursor:pointer;text-align:left;font:inherit}
    #side .sn:hover{background:rgba(255,255,255,.07)} #side .sn.on{background:rgba(31,200,232,.14);border-left-color:var(--cyan);color:#fff;font-weight:700}
    #side .sf{margin-top:auto;padding:12px 16px;border-top:1px solid rgba(255,255,255,.12);display:flex;gap:10px;align-items:center;font-size:13px} #side .sf img{width:30px;height:30px;border-radius:7px;background:#fff;object-fit:contain}
  }
  /* hero */
  .hero{margin:0 -14px 0;padding:calc(14px + env(safe-area-inset-top)) 16px 64px;background:radial-gradient(120% 90% at 85% 0%,#1d6df0 0%,rgba(29,109,240,0) 55%),linear-gradient(160deg,#0a2a7a 0%,#030b2e 70%);color:#fff;border-radius:0 0 26px 26px}
  .hrow{display:flex;align-items:center;gap:10px}
  .hlogo{width:54px;height:54px;border-radius:14px;box-shadow:0 0 0 1px rgba(31,200,232,.35),0 6px 18px rgba(31,200,232,.25)}
  .hbrand{flex:1;line-height:1.05} .hbrand .hw{font:italic 800 26px/1 system-ui,sans-serif} .hbrand .hp{font:italic 800 26px/1 system-ui,sans-serif;color:var(--cyan)} .hbrand small{display:block;font-size:12px;letter-spacing:.5px;color:#bcd2ff;margin-top:2px}
  .hco{display:flex;align-items:center;gap:10px;margin-top:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:8px 12px}
  .hco img{width:38px;height:38px;border-radius:9px;background:#fff;object-fit:contain;padding:2px} .hco small{display:block;color:#bcd2ff;font-size:12px} .hco b{font-size:15px}
  .kp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:-44px 0 12px}
  @media(min-width:700px){.kp{grid-template-columns:repeat(3,1fr)}}
  .kp .card{margin:0;padding:11px 13px} .kp b{display:block;font-size:24px;margin-top:1px;line-height:1.2} .kp small{color:var(--muted)}
  .kp .bad2{border-color:#f0a5a5;background:#fff6f6} .kp .bad2 b{color:#c0392b}
  .qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .qa button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:#16345c;cursor:pointer}
  .qa .ci{width:50px;height:50px;border-radius:16px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--primary);box-shadow:0 2px 6px rgba(20,50,90,.08)}
  .sec{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 8px} .sec b{font-size:16px}
  /* product */
  .th{width:64px;height:64px;border-radius:12px;border:1px solid var(--line);background:#f1f5fa;object-fit:contain;flex:none;display:flex;align-items:center;justify-content:center;color:#9aa8b8;overflow:hidden}
  .th.s{width:42px;height:42px;border-radius:9px}
  .pr{display:flex;gap:12px;align-items:flex-start}
  .gal{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .gal .g{position:relative} .gal .g img{width:84px;height:84px;object-fit:contain;border:1px solid var(--line);border-radius:12px;background:#f1f5fa;display:block}
  .gal .g .cv{position:absolute;left:4px;top:4px;font-size:10px;background:var(--primary);color:#fff;border-radius:5px;padding:0 5px}
  .gal .g .x{position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(20,35,58,.75);color:#fff;cursor:pointer;line-height:1}
  .add{width:84px;height:84px;border:2px dashed #b9c8dc;border-radius:12px;background:#f8fbff;color:#4b6585;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;gap:2px;cursor:pointer}
  /* segmented */
  .seg{display:flex;background:#e3ebf6;border-radius:12px;padding:3px;margin-bottom:12px;gap:2px;overflow-x:auto}
  .seg button{flex:1 0 auto;white-space:nowrap;border:0;background:none;padding:8px 12px;border-radius:10px;font-size:14px;color:#3c5272;cursor:pointer}
  .seg button.on{background:#fff;color:var(--primary);font-weight:700;box-shadow:0 1px 4px rgba(20,50,90,.15)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px} .chips button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;cursor:pointer;color:#2d4467} .chips button.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .sw{display:flex;gap:8px} .sw button{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer} .sw button.on{box-shadow:0 0 0 2px var(--primary)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .ck{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:14px;color:var(--text)}
  .logobox{display:flex;gap:12px;align-items:center}
  .logobox img,.logobox .ph{width:96px;height:96px;object-fit:contain;border:1px solid var(--line);border-radius:14px;background:#fff;padding:6px;display:flex;align-items:center;justify-content:center;color:#9aa8b8}
  /* calendar */
  .calbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px} .calbar h2{margin:0;flex:1;min-width:130px}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .cal .h{background:#f1f5fa;padding:6px;text-align:center;font-size:12px;color:var(--muted)}
  .day{background:#fff;min-height:84px;padding:4px 5px;cursor:pointer;overflow:hidden} .day:hover{background:#f6faff} .day.o{background:#f7f9fc;color:#9aa8b8}
  .day .n{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:12px;font-size:13px}
  .day.t .n{background:var(--primary);color:#fff} .day.sel{outline:2px solid var(--primary);outline-offset:-2px;background:#f0f7ff}
  .c{font-size:11px;border-radius:4px;padding:1px 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#dbeafe;color:#1e40af;border-left:3px solid #1d6df0}
  .c.done{background:#d6f5e8;color:#065f46;border-left-color:#0f9d6b} .c.other{background:#eef0f4;color:#445;border-left-color:#8a96a8}
  .more{font-size:11px;color:var(--muted);margin-top:2px}
  @media(max-width:700px){.day{min-height:52px}.day .c:nth-of-type(n+2){display:none}.c{font-size:10px}.two{grid-template-columns:1fr}}
  /* paper */
  .pwrap{width:100%;max-width:794px;margin:0 auto;overflow:hidden;position:relative;background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(20,50,90,.18)}
  .paper{width:794px;min-height:1123px;background:#fff;color:#111;padding:40px 44px;font-size:13px;line-height:1.45;transform-origin:top left;display:flex;flex-direction:column}
  .paper .hd{display:flex;gap:16px;align-items:flex-start;margin-bottom:14px} .paper .hd.right{flex-direction:row-reverse;text-align:right} .paper .hd.center{flex-direction:column;align-items:center;text-align:center}
  .paper .plogo{max-height:78px;max-width:170px;object-fit:contain} .paper .pco{flex:1;font-size:12px} .paper .pco b{font-size:17px}
  .paper .tt{display:flex;justify-content:space-between;align-items:flex-end;border-top:3px solid var(--pc);padding-top:8px;margin-bottom:10px}
  .paper .tt h4{margin:0;font-size:22px;color:var(--pc);line-height:1.1} .paper .tt small{color:#555}
  .paper .meta{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-bottom:12px}
  .paper .bx{border:1px solid #cdd6e2;border-radius:6px;padding:8px 10px;font-size:12.5px}
  .paper table.pt{margin-bottom:8px} .paper table.pt th{background:var(--pc);color:#fff;font-size:12px;cursor:default;padding:6px;border:0}
  .paper table.pt td{border-bottom:1px solid #d9e0ea;padding:5px 6px;font-size:12.5px} .paper .pt img{width:42px;height:42px;object-fit:contain;display:block}
  .paper .tot{margin-left:auto;width:300px;font-size:12.5px} .paper .tot div{display:flex;justify-content:space-between;padding:3px 6px} .paper .tot .g{background:var(--pc);color:#fff;font-weight:700;border-radius:4px;margin-top:3px}
  .paper .tx{font-size:12px;margin:6px 0 10px;color:#333}
  .paper .nt{white-space:pre-line;font-size:12px;border:1px solid #cdd6e2;border-radius:6px;padding:8px 10px;margin-bottom:10px}
  .paper .sg{display:flex;gap:18px;margin-top:auto;padding-top:34px} .paper .sg div{flex:1;text-align:center;font-size:12px} .paper .sg i{display:block;border-bottom:1px solid #333;height:38px;margin-bottom:4px}
  .paper .ft{text-align:center;font-size:11px;color:#666;margin-top:14px;border-top:1px solid #d9e0ea;padding-top:6px}
  #paperov .pbar{position:sticky;top:0;display:flex;gap:8px;justify-content:center;padding:10px;background:rgba(3,11,46,.9);z-index:2}
  #paperov .pbody{max-width:860px;margin:0 auto;padding:10px;height:calc(100% - 62px);overflow:auto}
  @media print{
    body>*:not(#paperov){display:none!important} body{padding:0;background:#fff}
    #paperov{display:block!important;position:static;background:none} #paperov .pbar{display:none} #paperov .pbody{padding:0;height:auto;max-width:none;overflow:visible}
    #paperov .pwrap{height:auto!important;background:none;border-radius:0;overflow:visible} #paperov .paper{transform:none!important;margin:0}
    @page{size:A4;margin:0}
  }
</style>
</head>
<body class="home">
<div class="banner">ตัวอย่างหน้าจอ (ข้อมูลสมมติ ไม่เชื่อมฐานข้อมูล) — รีเฟรชแล้วข้อมูลกลับเป็นค่าเริ่มต้น · ดูในบทบาทอื่นได้ที่ รูปโปรไฟล์ มุมขวาบน</div>
<aside id="side"></aside>
<header class="top" id="top"><button class="ib" id="back" onclick="back()"></button><h1 id="ptitle"></h1><button class="ib" id="sbtn" onclick="toggleSearch()"></button><span id="topact"></span><button class="av" id="avt" onclick="go('profile')"></button></header>
<div id="srow" hidden><input id="q" placeholder="ค้นหาในหน้านี้..." oninput="applySearch()"></div>
<main id="view"></main>
<nav class="bar"><div id="bar"></div></nav>
<div class="ov" id="sheetov" onclick="if(event.target===this)toggleSheet(false)"><div class="sheet" id="sheet"></div></div>
<div class="ov" id="modal" onclick="if(event.target===this)closeModal()"><div class="mdl" id="mdl"></div></div>
<div class="ov" id="paperov" style="background:#0b1530"><div class="pbar"><button class="btn" onclick="window.print()">พิมพ์ / บันทึก PDF</button><button class="btn ghost" onclick="closePaper()">ปิด</button></div><div class="pbody" id="pbody"></div></div>

function pickImage(max,png,cb){const i=document.createElement('input');i.type='file';i.accept='image/png,image/jpeg,image/webp';
  i.onchange=()=>{const f=i.files[0];if(!f)return;if(!/^image\/(png|jpe?g|webp)$/.test(f.type))return toast('รองรับเฉพาะไฟล์ PNG / JPG / WebP');if(f.size>8*1024*1024)return toast('ไฟล์ใหญ่เกิน 8 MB');
    const r=new FileReader();r.onload=()=>{const im=new Image();im.onerror=()=>toast('เปิดไฟล์ภาพไม่ได้');im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
      const g=c.getContext('2d');if(!png){g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height)}g.drawImage(im,0,0,c.width,c.height);const u=c.toDataURL(png?'image/png':'image/jpeg',.85);cb(u,Math.round(u.length*.75/1024))};im.src=r.result};r.readAsDataURL(f)};i.click()}

visits(){
  const c=S.cal,first=new Date(c.y,c.m,1),start=addD(first,-first.getDay()),rows=Math.ceil((first.getDay()+new Date(c.y,c.m+1,0).getDate())/7);
  const vs=S.visits.filter(v=>v.status!=='cancelled'&&(S.vmine==='all'||v.who==='me'));const byDay={};vs.forEach(v=>{const k=dkey(addD(BASE,v.off));(byDay[k]=byDay[k]||[]).push(v)});

     ${list.slice(0,3).map(v=>`<div class="c ${v.status==='done'?'done':v.who==='me'?'':'other'}">${v.s} ${custName(v.cust).replace('บริษัท ','').replace('ห้างหุ้นส่วน ','')}</div>`).join('')}${list.length>3?`<div class="more">+${list.length-3} นัด</div>`:''}</div>`}

   <select onchange="S.vmine=this.value;render()"><option value="all" ${S.vmine==='all'?'selected':''}>ทั้งทีม</option><option value="me" ${S.vmine==='me'?'selected':''}>ของฉัน</option></select></div>

   ${sel.map(v=>`<div class="card f"><b>${v.s}–${v.e} · ${v.title}</b><div class="muted">${custName(v.cust)} · ${v.who==='me'?'คุณเอ (เซลส์)':'คุณบี (เซลส์)'}</div>
    <div class="row" style="margin:6px 0"><span class="pill ${v.status==='done'?'ok':''}">${v.status==='done'?'เสร็จแล้ว':'วางแผน'}</span>${v.checked?'<span class="pill ok">เช็คอินแล้ว</span>':''}</div>
    ${can('visits')&&v.status==='planned'&&v.who==='me'?`<div class="row"><button class="btn ghost sm" onclick="vAct(${v.id},'checkin')">เช็คอินตำแหน่ง</button><button class="btn sm" onclick="vAct(${v.id},'done')">จบการเข้าพบ</button><button class="btn red sm" onclick="vAct(${v.id},'cancelled')">ยกเลิกนัด</button></div>`:''}</div>`).join('')||'<div class="card muted">ไม่มีนัดในวันนี้</div>'}
   ${can('visits')?`<div class="card" id="vform"><b>เพิ่มนัดเข้าพบ — ${sd.getDate()} ${THM[sd.getMonth()]}</b><div class="row" style="margin-top:8px">
    <select id="vc">${S.customers.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><input id="vt" placeholder="หัวข้อ" style="flex:1;min-width:140px">
    <input id="vs" type="time" value="09:00"><select id="vd"><option value="30">30 นาที</option><option value="60" selected>1 ชม.</option><option value="120">2 ชม.</option><option value="240">4 ชม.</option></select>

function setDS(k,v){const d=S.dd[S.ds];d[k]=v;updPV()}
function updPV(){const d=S.dd[S.ds],pv=document.getElementById('pv');if(!pv)return;const ns=document.getElementById('nosample');
  const saved=S.docs;S.docs=S.dd;try{ns.textContent=fmtNo(S.ds,1,2026);pv.innerHTML=wrapPaper(paperHtml(S.ds,sampleCtx(S.ds,d),d))}finally{S.docs=saved}fitPapers()}
function fullPreview(){const saved=S.docs;S.docs=S.dd;try{showPaper(S.ds,sampleCtx(S.ds,S.dd[S.ds]))}finally{S.docs=saved}}
function saveDocs(){const bad=Object.entries(S.dd).find(([k,d])=>!/^[A-Z0-9]{1,6}$/.test(d.prefix)||!d.title.trim());
  if(bad)return toast('ตรวจสอบ: ตัวอักษรนำหน้าต้องมี 1–6 ตัว (A–Z, 0–9) และชื่อเอกสารต้องไม่ว่าง ('+bad[1].title+')');
  const pre=Object.values(S.dd).map(d=>d.prefix);if(new Set(pre).size!==pre.length)return toast('ตัวอักษรนำหน้าเลขที่ซ้ำกันระหว่างเอกสาร — กรุณาเปลี่ยน');
  S.docs=JSON.parse(JSON.stringify(S.dd));toast('บันทึกแล้ว — เอกสารใหม่จะใช้รูปแบบนี้ (เลขที่เดิมที่ออกไปแล้วไม่เปลี่ยน)');render()}
function pickLogo(){pickImage(400,true,(u,kb)=>{S.cd.logo=u;render();toast('ย่อโลโก้เหลือ ~'+kb+' KB แล้ว — กดบันทึกเพื่อใช้งาน')})}
function saveCompany(){const c=S.cd;if(!c.name.trim())return toast('กรอกชื่อบริษัท');if(c.tax&&!/^\d{13}$/.test(c.tax))return toast('เลขประจำตัวผู้เสียภาษีต้องมี 13 หลัก');
  if(c.email&&!/^\S+@\S+\.\S+$/.test(c.email))return toast('รูปแบบอีเมลไม่ถูกต้อง');S.company=JSON.parse(JSON.stringify(c));toast('บันทึกข้อมูลบริษัทแล้ว');back()}

function productForm(id){const p=id?S.products.find(x=>x.id===id):{sku:'',name:'',unit:'ตัว',price:0,min:0,imgs:[]};S.pf={id:id||0,imgs:[...p.imgs]};
  openModal(`<h3 style="margin:0 0 10px">${id?'แก้ไขสินค้า':'ลงทะเบียนสินค้า'}</h3><div class="two"><label class="f">รหัสสินค้า (SKU) *<input id="pf_sku" value="${esc(p.sku)}"></label><label class="f">หน่วย *<input id="pf_unit" value="${esc(p.unit)}"></label></div>
   <label class="f">ชื่อสินค้า *<input id="pf_name" value="${esc(p.name)}"></label><div class="two"><label class="f">ราคาขาย (บาท)<input id="pf_price" type="number" min="0" step="0.01" value="${p.price}"></label><label class="f">Safety Stock<input id="pf_min" type="number" min="0" value="${p.min}"></label></div>
   <div class="muted" style="margin-bottom:6px">รูปสินค้า (สูงสุด 3 รูป · รูปแรกเป็นรูปหลัก · ย่อให้อัตโนมัติ)</div><div class="gal" id="pf_gal"></div>
   <div class="row" style="margin-top:14px"><button class="btn" onclick="saveProduct()">บันทึก</button><button class="btn ghost" onclick="closeModal()">ยกเลิก</button></div>`);pfGal()}
function pfGal(){const g=document.getElementById('pf_gal');if(!g)return;g.innerHTML=S.pf.imgs.map((u,i)=>`<div class="g"><img src="${u}" alt="">${i===0?'<span class="cv">รูปหลัก</span>':''}<button class="x" title="ลบ" onclick="pfDel(${i})">×</button>${i>0?`<button class="btn ghost sm" style="position:absolute;left:4px;bottom:4px;min-height:22px;padding:0 6px;font-size:11px" onclick="pfCover(${i})">ตั้งเป็นหลัก</button>`:''}</div>`).join('')+(S.pf.imgs.length<3?`<button class="add" onclick="pfAdd()">${ic('image')}เพิ่มรูป</button>`:'')}
function pfAdd(){pickImage(640,false,(u,kb)=>{S.pf.imgs.push(u);pfGal();toast('ย่อรูปเหลือ ~'+kb+' KB')})}
function pfDel(i){S.pf.imgs.splice(i,1);pfGal()}
function pfCover(i){const [u]=S.pf.imgs.splice(i,1);S.pf.imgs.unshift(u);pfGal()}
function saveProduct(){const g=i=>document.getElementById(i).value.trim();const sku=g('pf_sku').toUpperCase(),name=g('pf_name'),unit=g('pf_unit'),price=parseFloat(g('pf_price')||'0'),min=parseFloat(g('pf_min')||'0');
  if(!sku||!name||!unit)return toast('กรอกรหัส ชื่อ และหน่วย');if(isNaN(price)||price<0||isNaN(min)||min<0)return toast('ราคาและ Safety Stock ต้องไม่ติดลบ');
  if(S.products.some(p=>p.sku===sku&&p.id!==S.pf.id))return toast('รหัสสินค้านี้มีอยู่แล้วในบริษัท');
  if(S.pf.id){Object.assign(S.products.find(p=>p.id===S.pf.id),{sku,name,unit,price,min,imgs:S.pf.imgs})}else{S.products.push({id:Math.max(0,...S.products.map(p=>p.id))+1,sku,name,unit,price,min,on:0,res:0,imgs:S.pf.imgs})}
  closeModal();toast('บันทึกสินค้าแล้ว');render()}
function gallery(id){const p=prod(id);openModal(`<h3 style="margin:0 0 10px">${p.name}</h3><div class="gal">${p.imgs.map(u=>`<div class="g"><img style="width:150px;height:150px" src="${u}" alt=""></div>`).join('')||'<span class="muted">ยังไม่มีรูป</span>'}</div><div class="row" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">ปิด</button></div>`)}

const NAVS=[['home','หน้าแรก','home'],['customers','ลูกค้า','users'],['visits','นัดหมาย','calendar'],['g','เอกสาร'],['docs:quotes','ใบเสนอราคา','file'],['docs:jobs','Job Ticket','clip'],['docs:delivery','ส่งของ (DO)','truck'],['docs:dns','ใบส่งของ','dncheck'],['docs:invoices','อินวอยซ์','receipt'],['g','สินค้าและคลัง'],['products','สินค้า','box'],['stock','สต็อก','chart'],['zones','โซนส่งของ','pin'],['g','ตั้งค่า'],['members','สมาชิก','key'],['company','ตั้งค่าบริษัท','building'],['docset','ตั้งค่าเอกสาร','sliders']];
function navTo(k){if(k.startsWith('docs:')){S.dtab=k.slice(5);go('docs')}else go(k)}
function renderSide(){const c=S.company;document.getElementById('side').innerHTML=`<div class="sb"><img src="${LOGO_APP}" alt=""><div><b>Sale<span>Pro</span></b><small>by Monte</small></div></div>`+NAVS.map(([k,l,i])=>k==='g'?`<div class="sg">${l}</div>`:`<button class="sn ${(k.startsWith('docs:')?S.page==='docs'&&S.dtab===k.slice(5):S.page===k)?'on':''}" onclick="navTo('${k}')">${ic(i)}${l}</button>`).join('')+`<div class="sf">${c.logo?`<img src="${c.logo}" alt="">`:''}<span>${esc(c.name)}</span></div>`}
function render(){renderSide();
  const home=S.page==='home';document.body.classList.toggle('home',home);
  document.getElementById('bar').innerHTML=BAR.map(([k,l,i])=>{const on=k==='tools'?TOOLPAGES.includes(S.page):S.page===k;return `<button class="bi ${on?'on':''} ${k==='tools'?'mid':''}" onclick="go('${k}')">${k==='tools'?`<span class="disc">${ic(i,26)}</span>`:ic(i)}<span>${l}</span></button>`}).join('');
  document.getElementById('back').innerHTML=ic('back');document.getElementById('back').className='ib'+(BAR.some(b=>b[0]===S.page)?' hid':'');document.getElementById('sbtn').innerHTML=ic('search');document.getElementById('avt').textContent='เอ';
  document.getElementById('ptitle').textContent=TITLES[S.page]||'';
  const ta=TOPACT();document.getElementById('topact').innerHTML=ta&&can(ta[2])?`<button class="btn sm" style="min-height:40px" onclick="${ta[1]}">${ic('plus',16)} ${ta[0]}</button>`:'';
  document.getElementById('sbtn').style.display=['home','profile','company','docset'].includes(S.page)?'none':'';
  document.getElementById('view').innerHTML=V[S.page]();applySearch();if(S.page==='docset')updPV();fitPapers()}
function applySearch(){const q=document.getElementById('q').value.trim().toLowerCase();document.querySelectorAll('#view .card.f').forEach(e=>{e.style.display=!q||e.textContent.toLowerCase().includes(q)?'':'none'});
  document.querySelectorAll('#view table tr').forEach(r=>{if(r.querySelector('th'))return;if(r.closest('.paper'))return;r.style.display=!q||r.textContent.toLowerCase().includes(q)?'':'none'})}
function selDay(k){S.cal.sel=k;const d=new Date(k+'T00:00:00');S.cal.y=d.getFullYear();S.cal.m=d.getMonth();render()}
function calGo(n){const d=new Date(S.cal.y,S.cal.m+n,1);S.cal.y=d.getFullYear();S.cal.m=d.getMonth();render()}
function calToday(){S.cal={y:BASE.getFullYear(),m:BASE.getMonth(),sel:dkey(BASE)};render()}
function goForm(){const e=document.getElementById('vform');if(e)e.scrollIntoView({behavior:'smooth'});const t=document.getElementById('vt');if(t)t.focus()}
function addVisit(){const cust=+document.getElementById('vc').value,title=document.getElementById('vt').value.trim(),st=document.getElementById('vs').value,du=+document.getElementById('vd').value;
  if(!title)return toast('กรอกหัวข้อการเข้าพบ');if(!st)return toast('เลือกเวลาเริ่ม');const a=mins(st),b=a+du;if(b>1440)return toast('นัดต้องจบภายในวันเดียวกัน');
  const off=Math.round((new Date(S.cal.sel+'T00:00:00')-BASE)/864e5);const clash=S.visits.find(v=>v.who==='me'&&v.status==='planned'&&v.off===off&&mins(v.s)<b&&a<mins(v.e));
  if(clash)return toast('ช่วงเวลานี้คุณมีนัดอื่นอยู่แล้ว ('+clash.s+'–'+clash.e+') — ระบบปฏิเสธ');
  const hh=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');S.vSeq++;S.visits.push({id:S.vSeq,cust,title,off,s:hh(a),e:hh(b),who:'me',status:'planned',checked:false});toast('เพิ่มนัดแล้ว');render()}
function vAct(id,a){const v=S.visits.find(x=>x.id===id);if(a==='checkin'){v.checked=true;toast('บันทึกตำแหน่งเช็คอิน (ตัวอย่าง)')}else v.status=a;render()}
document.getElementById('view').addEventListener('click',e=>{const th=e.target.closest('th');if(!th||th.closest('.paper'))return;const t=th.closest('table'),i=[...th.parentNode.children].indexOf(th),rows=[...t.querySelectorAll('tr')].filter(r=>!r.querySelector('th'));
  const dir=th.dataset.d==='a'?-1:1;th.dataset.d=dir===1?'a':'d';const num=x=>parseFloat(x.replace(/[^0-9.-]/g,''));
  rows.sort((x,y)=>{const a=x.children[i].textContent,b=y.children[i].textContent;return(isNaN(num(a))||isNaN(num(b))?a.localeCompare(b,'th'):num(a)-num(b))*dir}).forEach(r=>r.parentNode.appendChild(r))});
const custOpts=()=>S.customers.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
function addJob(){openModal(`<h3 style="margin:0 0 10px">เปิด Job Ticket</h3><label class="f">ลูกค้า *<select id="jf_c">${custOpts()}</select></label><label class="f">หัวข้อ *<input id="jf_t" placeholder="เช่น ขอใบเสนอราคา / แจ้งปัญหาสินค้า"></label>
  <div class="two"><label class="f">ความสำคัญ<select id="jf_p"><option>ปกติ</option><option>สูง</option></select></label><label class="f">กำหนดเสร็จ<input id="jf_d" type="date" value="${dkey(addD(BASE,14))}"></label></div>
  <div class="row"><button class="btn" onclick="createJob()">เปิดงาน</button><button class="btn ghost" onclick="closeModal()">ยกเลิก</button></div>`)}
function createJob(){const g=i=>document.getElementById(i).value.trim();const t=g('jf_t');if(!t)return toast('กรอกหัวข้อ');S.jSeq++;
  S.jobs.unshift({id:S.jSeq,no:'JT-2026-'+String(S.jSeq).padStart(4,'0'),cust:+g('jf_c'),title:t,pri:g('jf_p'),status:'open',due:g('jf_d')||dkey(addD(BASE,14)),log:['เปิดงาน']});closeModal();toast('ออกเลข JT ให้อัตโนมัติ');render()}
function moveJob(id,s){const j=S.jobs.find(x=>x.id===id);j.log.push(j.status+' → '+s);j.status=s;render()}
function addQuote(){openModal(`<h3 style="margin:0 0 10px">สร้างใบเสนอราคา</h3><label class="f">ออกให้ลูกค้า *<select id="qf_c">${custOpts()}</select></label><div class="row"><button class="btn" onclick="createQuote()">สร้าง</button><button class="btn ghost" onclick="closeModal()">ยกเลิก</button></div>`)}
function createQuote(){const c=+document.getElementById('qf_c').value;S.qSeq++;S.quotes.unshift({id:S.qSeq,seq:S.qSeq,cust:c,status:'draft',discount:0,vat:S.docs.quote.vat,items:[]});closeModal();toast('ออกเลข '+fmtNo('quote',S.qSeq)+' ให้ '+custName(c));render()}
function issueInvoice(qid){const q=S.quotes.find(x=>x.id===qid);if(q.status!=='accepted')return toast('ออกอินวอยซ์ได้เฉพาะใบเสนอราคาที่ลูกค้าตกลงแล้ว');
  if(S.invoices.some(v=>v.qid===qid&&v.status!=='cancelled'))return toast('ใบเสนอราคานี้มีอินวอยซ์อยู่แล้ว');
  S.ivSeq++;S.invoices.unshift({id:S.ivSeq,seq:S.ivSeq,qid,cust:q.cust,items:q.items.map(i=>({...i})),discount:q.discount,vat:q.vat,date:dkey(BASE),due:dkey(addD(BASE,S.docs.invoice.days)),status:'issued'});S.dtab='invoices';toast('ออกอินวอยซ์ '+fmtNo('invoice',S.ivSeq));render()}
function payInvoice(id){const v=S.invoices.find(x=>x.id===id);v.status='paid';v.paidDate=dkey(BASE);toast('บันทึกรับชำระแล้ว');render()}
function cancelInvoice(id){S.invoices.find(x=>x.id===id).status='cancelled';toast('ยกเลิกอินวอยซ์ — ออกใหม่จากใบเสนอราคาได้');render()}
function issueDN(doId){const d=S.dos.find(x=>x.id===doId);if(!['dispatched','delivered'].includes(d.status))return toast('ออกใบส่งของได้หลังออกจัดส่ง');if(S.dns.some(n=>n.doId===doId))return toast('DO นี้มีใบส่งของแล้ว');
  S.dnSeq++;S.dns.unshift({id:S.dnSeq,seq:S.dnSeq,doId,status:'issued'});toast('ออกใบส่งของ '+fmtNo('dn',S.dnSeq));render()}
function receiveDN(id){const n=S.dns.find(x=>x.id===id);const name=prompt('ชื่อผู้ตรวจรับสินค้า','');if(!name||!name.trim())return toast('ต้องระบุชื่อผู้ตรวจรับ');n.status='received';n.recv=name.trim();n.recvDate=thDate(BASE);const d=S.dos.find(x=>x.id===n.doId);if(d.status==='dispatched')d.status='delivered';toast('บันทึกตรวจรับแล้ว — DO เป็น ส่งสำเร็จ');render()}
function addItem(id){const p=S.products[Math.floor(Math.random()*S.products.length)];S.quotes.find(q=>q.id===id).items.push({pid:p.id,q:2,u:p.price});render()}
function disc(id){const v=parseFloat(prompt('ส่วนลด (บาท)','500'));if(!isNaN(v)&&v>=0){S.quotes.find(q=>q.id===id).discount=v;render()}}
function moveQuote(id,s){const q=S.quotes.find(x=>x.id===id);if(s==='sent'&&(q.items.length===0||q.discount>qTotals(q).sub)){toast('ต้องมีรายการ และส่วนลดต้องไม่เกินยอดรวม ก่อนส่ง');return}q.status=s;render()}
function recv(id){const p=S.products.find(x=>x.id===id);const v=parseFloat(prompt('จำนวนที่รับเข้า','10'));if(!(v>0))return;p.on+=v;log(p,'รับเข้า',v,0,'รับสินค้า');render()}
function adj(id){const p=S.products.find(x=>x.id===id);const v=parseFloat(prompt('ยอดนับจริงใหม่',p.on));if(isNaN(v)||v<p.res){toast('ยอดต้องไม่ต่ำกว่าที่จองไว้');return}const n=prompt('เหตุผล (จำเป็น)','นับสต็อกประจำเดือน');if(!n)return toast('การปรับยอดต้องใส่เหตุผล');log(p,'ปรับยอด',v-p.on,0,n);p.on=v;render()}
function makeDO(){const c=S.customers.find(x=>x.id==document.getElementById('doc').value),p=S.products.find(x=>x.id==document.getElementById('dop').value),q=parseFloat(document.getElementById('doq').value);if(!(q>0))return;
  const a=c.addr.find(x=>x.def)||c.addr[0];S.doSeq++;S.dos.push({id:S.doSeq,seq0:S.doSeq,cust:c.id,zone:a.zone,ship:a.line+' '+a.prov,lat:a.lat,lng:a.lng,pid:p.id,qty:q,status:'draft',seq:0});toast('ออกเลข '+fmtNo('do',S.doSeq)+' และคัดลอกที่อยู่/พิกัด/โซนลงเอกสาร');render()}
function doAct(id,to){const d=S.dos.find(x=>x.id===id),p=prod(d.pid);
  if(to==='ready'){if(avail(p)<d.qty){toast('สต็อกไม่พอ (ใช้ได้ '+avail(p)+') — ระบบปฏิเสธ และสถานะยังเป็นร่าง');return}p.res+=d.qty;log(p,'จอง',0,d.qty,fmtNo('do',d.seq0))}
  if(to==='dispatched'){p.on-=d.qty;p.res-=d.qty;log(p,'ตัดจ่าย',-d.qty,-d.qty,fmtNo('do',d.seq0))}
  if(to==='cancelled'&&d.status==='ready'){p.res-=d.qty;log(p,'ปล่อยจอง',0,-d.qty,fmtNo('do',d.seq0))}d.status=to;render()}
function autoOrder(zid){const list=S.dos.filter(d=>d.zone===zid&&d.status!=='cancelled');let cur=null,left=[...list],n=0;while(left.length){let bi=0;if(cur){let bd=1e9;left.forEach((d,i)=>{const x=km(cur,[d.lat,d.lng]);if(x<bd){bd=x;bi=i}})}const [d]=left.splice(bi,1);d.seq=++n;cur=[d.lat,d.lng]}toast('จัดลำดับจุดส่งตามระยะใกล้ที่สุด');render()}
window.addEventListener('resize',fitPapers);
render();
</script>
</body>
